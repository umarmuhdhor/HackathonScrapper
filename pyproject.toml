[project]
name = "hackathon-screening"
version = "0.1.0"
description = "Scrape live hackathons (Devpost, lablab.ai) and track the ones you joined."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scraper", "api"]
